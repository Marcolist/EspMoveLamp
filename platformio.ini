[platformio]
default_envs = lamp, cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -I include
lib_deps = bblanchon/ArduinoJson@7.3.1

[env:lamp]
build_src_filter = +<lamp/>
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit NeoPixel@1.12.3

[cyd_base]
build_src_filter = +<cyd/>
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
build_flags =
    ${env.build_flags}
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; Display driver taken from /home/marco/NeuraLiquid/CYD/platformio.ini.
[env:cyd]
extends = cyd_base
build_flags =
    ${cyd_base.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1

[env:cyd_ili9341]
extends = cyd_base
build_flags =
    ${cyd_base.build_flags}
    -DILI9341_DRIVER=1
