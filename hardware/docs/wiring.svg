<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-label="EspMoveLamp low voltage wiring and GPIO pinout"><rect width="1400" height="1080" fill="#091b2b"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62dded"/></marker></defs><g font-family="Arial, sans-serif"><text x="50" y="57" font-size="34" fill="#dcecf7">EspMoveLamp · pinout &amp; wiring</text><text x="50" y="92" font-size="17" fill="#87b8d4">LOW-VOLTAGE CONNECTIONS · DEFAULT: ONE GPIO / FOUR STRIPS</text><rect x="50" y="130" width="300" height="220" rx="16" fill="#102b40" stroke="#31566f"/><text x="75" y="168" font-size="25" fill="#dcecf7">LAMP ESP32</text><text x="75" y="211" font-size="20" fill="#dcecf7">GPIO18 · LED data</text><text x="75" y="251" font-size="20" fill="#ffc678">GPIO27 · servo signal</text><text x="75" y="292" font-size="20" fill="#dcecf7">5V input / GND</text><text x="75" y="322" font-size="16" fill="#dcecf7">Never connect 5 V to 3V3</text><rect x="420" y="130" width="390" height="220" rx="16" fill="#102b40" stroke="#31566f"/><text x="445" y="168" font-size="25" fill="#dcecf7">SN74AHCT125 · 5 V</text><text x="445" y="211" font-size="20" fill="#dcecf7">Pin 2 / 1A → pin 3 / 1Y</text><text x="445" y="250" font-size="20" fill="#dcecf7">Pin 1 / 1OE → GND</text><text x="445" y="287" font-size="20" fill="#dcecf7">Pin 14 → +5V · pin 7 → GND</text><text x="445" y="322" font-size="17" fill="#dcecf7">100 nF across VCC and GND</text><path d="M350 205H420" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><path d="M810 205H830M865 205H880V230H940" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><rect x="830" y="198" width="35" height="14" fill="#102b40" stroke="#62dded" stroke-width="2"/><text x="833" y="183" font-size="18" fill="#dcecf7">330 Ω</text><text x="942" y="148" font-size="21" fill="#dcecf7">LED CHAIN · 4 × 30 PIXELS</text><rect x="940" y="200" width="400" height="60" rx="16" fill="#102b40" stroke="#31566f"/><text x="1030" y="237" font-size="19" fill="#dcecf7">TOP</text><text x="950" y="237" font-size="15" fill="#dcecf7">DIN</text><text x="1290" y="237" font-size="15" fill="#dcecf7">OUT</text><path d="M985 250H1290" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><rect x="940" y="290" width="400" height="60" rx="16" fill="#102b40" stroke="#31566f"/><text x="1030" y="327" font-size="19" fill="#dcecf7">FRONT UPPER</text><text x="950" y="327" font-size="15" fill="#dcecf7">OUT</text><text x="1300" y="327" font-size="15" fill="#dcecf7">DIN</text><path d="M1290 340H985" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><rect x="940" y="380" width="400" height="60" rx="16" fill="#102b40" stroke="#31566f"/><text x="1030" y="417" font-size="19" fill="#dcecf7">FRONT LOWER</text><text x="950" y="417" font-size="15" fill="#dcecf7">DIN</text><text x="1290" y="417" font-size="15" fill="#dcecf7">OUT</text><path d="M985 430H1290" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><rect x="940" y="470" width="400" height="60" rx="16" fill="#102b40" stroke="#31566f"/><text x="1030" y="507" font-size="19" fill="#dcecf7">BOTTOM</text><text x="950" y="507" font-size="15" fill="#dcecf7">OUT</text><text x="1300" y="507" font-size="15" fill="#dcecf7">DIN</text><path d="M1290 520H985" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><path d="M1340 230H1360V320H1340" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><path d="M940 320H915V410H940" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><path d="M1340 410H1360V500H1340" fill="none" stroke="#62dded" stroke-width="3" marker-end="url(#a)"/><text x="940" y="562" font-size="17" fill="#dcecf7">Same viewing side for all four strips</text><rect x="50" y="390" width="760" height="190" rx="16" fill="#102b40" stroke="#31566f"/><text x="75" y="430" font-size="24" fill="#dcecf7">DS3225 SERVO</text><path d="M350 245H382V370H790V390" fill="none" stroke="#ffc678" stroke-width="3"/><text x="75" y="469" font-size="20" fill="#ffc678">GPIO27 → signal (usually orange / yellow)</text><text x="75" y="509" font-size="20" fill="#dcecf7">+5V → servo power · GND → servo ground</text><text x="75" y="548" font-size="17" fill="#dcecf7">Confirm connector polarity on your exact servo.</text><rect x="50" y="615" width="1290" height="205" rx="16" fill="#102b40" stroke="#31566f"/><text x="75" y="658" font-size="25" fill="#dcecf7">SHARED REGULATED 5 V SUPPLY</text><path d="M80 690H1305" fill="none" stroke="#ff7a85" stroke-width="3"/><text x="90" y="718" font-size="21" fill="#ff9aa3">+5V → each LED strip +5V, servo power, ESP32 board 5V input</text><path d="M80 742H1305" fill="none" stroke="#a6b6c4" stroke-width="3"/><text x="90" y="774" font-size="20" fill="#dcecf7">GND → each LED strip GND, servo GND, ESP32 GND, level shifter GND</text><text x="75" y="804" font-size="17" fill="#dcecf7">Parallel power branches; never route LED or servo power through the ESP32.</text><rect x="50" y="850" width="620" height="175" rx="16" fill="#102b40" stroke="#31566f"/><text x="75" y="890" font-size="22" fill="#dcecf7">OPTIONAL: FOUR DATA OUTPUTS</text><text x="75" y="925" font-size="19" fill="#dcecf7">GPIO18 → top · GPIO19 → front upper</text><text x="75" y="957" font-size="19" fill="#dcecf7">GPIO23 → front lower · GPIO25 → bottom</text><text x="75" y="993" font-size="17" fill="#dcecf7">Set LED_OUTPUTS = 4; all strips left → right.</text><rect x="700" y="850" width="640" height="175" rx="16" fill="#102b40" stroke="#31566f"/><text x="725" y="890" font-size="22" fill="#dcecf7">CYD · SEPARATE USB POWER</text><text x="725" y="925" font-size="20" fill="#62dded">CYD → Wi-Fi → lamp ESP32 → LED bus</text><text x="725" y="958" font-size="17" fill="#dcecf7">No wired power connection to the lamp required.</text><text x="725" y="993" font-size="17" fill="#dcecf7">4 A firmware budget estimates LEDs only.</text><text x="50" y="1055" font-size="16" fill="#dcecf7">Add bulk capacitance near LEDs. Verify board power input and prevent USB / external 5 V backfeeding.</text></g></svg>