<text x="486" y="544" font-size="15" fill="#b4d3e5">Axle height: 53 mm above base</text>
<text x="486" y="573" font-size="15" fill="#b4d3e5">Axis offset: one 2040 core hole, not centered</text>
<text x="486" y="610" font-size="15" fill="#7bd3ff">Servo drive at LEFT end · passive shaft at RIGHT end</text>
<text x="486" y="642" font-size="14" fill="#b4d3e5">Internal PSU beside servo · ESP32 behind servo</text></g>
